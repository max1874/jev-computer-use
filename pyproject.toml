[project]
name = "open-computer-use"
version = "0.1.0"
description = "A macOS computer-use agent that chooses instead of generating. Accessibility tree first, pixels only as a last resort."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx[http2]>=0.28,<1"]

[project.urls]
Homepage = "https://github.com/max1874/open-computer-use"

[project.scripts]
open-computer-use = "open_computer_use.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["open_computer_use"]
artifacts = ["open_computer_use/bin/axbridge"]

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
